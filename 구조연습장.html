<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android MVVM Architecture Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0f2f5;
        }

        /* 손그림 느낌의 파일 카드 스타일 */
        .file-card {
            border: 3px solid #1f2937;
            border-radius: 15px 5px 15px 5px / 5px 15px 5px 15px;
            background-color: #ffffff;
            box-shadow: 5px 5px 0px #1f2937;
            padding: 1rem;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .layer-container {
            border: 2px dashed #9ca3af;
            padding: 1.5rem;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.5);
            min-height: 450px;
        }

        .title-font {
            font-family: 'Nanum Pen Script', cursive;
        }

        .item-list li {
            position: relative;
            padding-left: 1.2rem;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .item-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #1f2937;
            font-weight: bold;
        }

        .file-summary-badge {
            font-size: 0.75rem;
            color: #4b5563;
            background-color: #f3f4f6;
            padding: 2px 8px;
            border-radius: 9999px;
            border: 1px solid #d1d5db;
            margin-top: 4px;
            display: inline-block;
        }

        /* 동적 파일 연결 흐름도 스타일 */
        .relation-map {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 30px;
            background: #fff;
            border: 4px solid #1f2937;
            border-radius: 25px;
            box-shadow: 6px 6px 0px #1f2937;
            margin-bottom: 40px;
            overflow-x: auto;
        }

        .node-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            min-width: 150px;
        }

        .node-box {
            padding: 8px 15px;
            border: 2px solid #1f2937;
            border-radius: 8px;
            background: #fff;
            font-family: monospace;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: 3px 3px 0px #1f2937;
            white-space: nowrap;
        }

        .connector-svg {
            flex-shrink: 0;
            width: 100px;
            height: 60px;
        }

        #loading-overlay {
            display: none;
            backdrop-filter: blur(4px);
        }

        .loader {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #1f2937;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

<!-- Header Area -->
<div class="w-full max-w-5xl mb-10 text-center">
    <h1 class="font-bold mb-2 title-font text-gray-800 text-6xl">Android MVVM File Map</h1>
    <p class="text-gray-600 mb-8">기능에 따라 생성해야 할 <span class="font-bold text-blue-600">실제 파일들</span>의 연결 구조를 보여드립니다.</p>

    <div class="flex w-full max-w-2xl mx-auto gap-3">
        <input type="text" id="app-idea-input" placeholder="예: 커피 키오스크 주문 시스템, 로또 번호 생성기"
               class="flex-1 px-6 py-4 rounded-xl border-4 border-gray-800 focus:outline-none text-lg shadow-[4px_4px_0px_#1f2937]">
        <button onclick="generateArchitecture()"
                class="px-8 py-4 bg-gray-800 text-white font-bold rounded-xl hover:bg-black transition-all shadow-[4px_4px_0px_#444] active:translate-y-1 active:shadow-none whitespace-nowrap text-lg">
            설계도 생성
        </button>
    </div>
</div>

<!-- Visualization Grid -->
<div id="diagram-container" class="w-full max-w-[1400px] hidden flex-col items-center opacity-0 transition-opacity duration-700">

    <!-- Connection Overview Flow -->
    <div class="w-full mb-10">
        <h3 class="title-font text-3xl text-center mb-6 text-gray-700">파일 간 참조 관계 (File Connection Map)</h3>
        <div id="relation-map-container" class="relation-map">
            <!-- Dynamic Nodes & Arrows will be injected here -->
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 w-full">
        <!-- VIEW LAYER -->
        <div class="layer-container border-blue-300">
            <h3 class="title-font text-3xl text-center mb-6 text-blue-800">UI Layer (View)</h3>
            <div id="view-files-container"></div>
        </div>

        <!-- VIEWMODEL LAYER -->
        <div class="layer-container border-green-300">
            <h3 class="title-font text-3xl text-center mb-6 text-green-800">State Layer (ViewModel)</h3>
            <div id="viewmodel-files-container"></div>
        </div>

        <!-- DATA LAYER -->
        <div class="layer-container border-purple-300">
            <h3 class="title-font text-3xl text-center mb-6 text-purple-800">Data Layer (Model)</h3>
            <div id="model-files-container"></div>
        </div>
    </div>

    <div class="mt-12 bg-white p-6 border-2 border-gray-800 rounded-lg shadow-md max-w-3xl">
        <h4 class="font-bold text-lg mb-2">💡 설계 가이드</h4>
        <p id="summary-text" class="text-gray-700 leading-relaxed"></p>
    </div>
</div>

<!-- Loading Overlay -->
<div id="loading-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white/90">
    <div class="loader mb-4"></div>
    <p class="title-font text-3xl font-bold text-gray-800">파일 구조와 연결 상태를 분석 중...</p>
</div>

<script>
    const apiKey = "";

    async function generateArchitecture() {
        const idea = document.getElementById('app-idea-input').value.trim();
        if (!idea) return;

        showLoading(true);

        const systemPrompt = `당신은 Android 개발 전문가입니다. 사용자의 앱 기능에 맞춰 '생성해야 할 개별 파일(클래스)' 단위로 구조를 설계하세요.

각 파일은 다음 형식을 포함해야 합니다:
- 'fileName': 실제 코틀린 파일명 (예: CoffeeOrderActivity.kt)
- 'fileSummary': 파일의 핵심 역할 요약
- 'details': 구체적인 로직 리스트
- 'references': 이 파일이 참조하거나 사용하는 파일명 리스트 (예: Activity는 ViewModel을 참조)

JSON 응답 형식:
{
"summary": "전체 흐름 요약",
"layers": {
"view": [{ "fileName": "...", "fileSummary": "...", "details": ["..."], "references": ["ViewModel파일명"] }],
"viewModel": [{ "fileName": "...", "fileSummary": "...", "details": ["..."], "references": ["Model파일명"] }],
"model": [{ "fileName": "...", "fileSummary": "...", "details": ["..."], "references": [] }]
}
}`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `앱 아이디어: ${idea}` }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            const data = await response.json();
            const result = JSON.parse(data.candidates[0].content.parts[0].text);
            renderDiagram(result);
        } catch (e) {
            console.error(e);
        } finally {
            showLoading(false);
        }
    }

    function renderDiagram(data) {
        // 레이어별 파일 렌더링 함수
        const renderLayer = (containerId, files) => {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            (files || []).forEach(file => {
                const card = document.createElement('div');
                card.className = 'file-card';
                card.innerHTML = `
                    <div class="flex flex-col mb-3">
                        <div class="flex items-center">
                            <span class="bg-gray-800 text-white text-[10px] px-1.5 py-0.5 rounded mr-2 font-mono">FILE</span>
                            <h4 class="font-bold text-gray-800 font-mono text-sm">${file.fileName}</h4>
                        </div>
                        <div class="file-summary-badge">${file.fileSummary}</div>
                    </div>
                    <ul class="item-list text-gray-600">
                        ${file.details.map(d => `<li>${d}</li>`).join('')}
                    </ul>
                `;
                container.appendChild(card);
            });
        };

        renderLayer('view-files-container', data.layers.view);
        renderLayer('viewmodel-files-container', data.layers.viewModel);
        renderLayer('model-files-container', data.layers.model);

        // 상단 파일 관계 맵 렌더링
        renderRelationMap(data.layers);

        document.getElementById('summary-text').innerText = data.summary;
        const diagramContainer = document.getElementById('diagram-container');
        diagramContainer.classList.remove('hidden');
        diagramContainer.classList.add('flex');
        setTimeout(() => { diagramContainer.classList.add('opacity-100'); }, 100);
    }

    function renderRelationMap(layers) {
        const container = document.getElementById('relation-map-container');
        container.innerHTML = '';

        const createNodeGroup = (files, bgColor) => {
            const group = document.createElement('div');
            group.className = 'node-group';
            files.forEach(f => {
                const node = document.createElement('div');
                node.className = `node-box ${bgColor}`;
                node.innerText = f.fileName;
                group.appendChild(node);
            });
            return group;
        };

        const createArrow = (label) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex flex-col items-center mx-2';
            wrapper.innerHTML = `
                <span class="title-font text-lg text-gray-500">${label}</span>
                <svg class="connector-svg" viewBox="0 0 100 40">
                    <path d="M0 20 L90 20" stroke="#1f2937" stroke-width="3" fill="none" />
                    <path d="M85 12 L95 20 L85 28" fill="#1f2937" />
                </svg>
            `;
            return wrapper;
        };

        // View 그룹
        container.appendChild(createNodeGroup(layers.view, 'bg-blue-50'));
        container.appendChild(createArrow('Observes'));

        // ViewModel 그룹
        container.appendChild(createNodeGroup(layers.viewModel, 'bg-green-50'));
        container.appendChild(createArrow('Requests'));

        // Model 그룹
        container.appendChild(createNodeGroup(layers.model, 'bg-purple-50'));
    }

    function showLoading(show) {
        document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
    }
</script>
</body>
</html>
